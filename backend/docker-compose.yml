services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8000}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:?APP_URL deve ser definido}
      # Nunca versionar credenciais reais. Use .env ou segredos do provedor cloud.
      - APP_KEY=${APP_KEY:?APP_KEY deve ser definido}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - MOBILE_RESET_URL=${MOBILE_RESET_URL:?MOBILE_RESET_URL deve ser definido}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:?SUPPORT_EMAIL deve ser definido}
      - LEGAL_UPDATED_AT=${LEGAL_UPDATED_AT:-18/09/2026}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE deve ser definido}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME deve ser definido}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD deve ser definido}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SANCTUM_EXPIRATION=${SANCTUM_EXPIRATION:-43200}
      - MAIL_MAILER=${MAIL_MAILER:?MAIL_MAILER deve ser definido}
      - MAIL_SCHEME=${MAIL_SCHEME:-null}
      - MAIL_HOST=${MAIL_HOST:?MAIL_HOST deve ser definido}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME deve ser definido}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?MAIL_PASSWORD deve ser definido}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS deve ser definido}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-ANOT}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      # Nunca versionar credenciais reais. Use .env ou segredos do provedor cloud.
      - POSTGRES_DB=${DB_DATABASE:?DB_DATABASE deve ser definido}
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME deve ser definido}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD deve ser definido}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME deve ser definido} -d ${DB_DATABASE:?DB_DATABASE deve ser definido}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
