name: ANOT CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  mobile-quality:
    name: Mobile TypeScript, Expo and dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: cd mobile && npm ci

      - name: Run TypeScript Check
        run: cd mobile && npm run typecheck

      - name: Run Expo Doctor
        run: cd mobile && npm run doctor

      - name: Audit production dependencies
        run: cd mobile && npm audit --omit=dev --audit-level=high

      - name: Export Android bundle
        run: cd mobile && npx expo export --platform android

      - name: Upload Android export artifact
        uses: actions/upload-artifact@v4
        with:
          name: anot-android-export-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error
          retention-days: 14

  backend-tests:
    name: Backend PHPUnit & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anot_test
          POSTGRES_USER: anot_user
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: cd backend && composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js for web assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install web dependencies
        run: cd backend && npm ci --ignore-scripts

      - name: Build web assets
        run: cd backend && npm run build

      - name: Upload web assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: anot-web-assets-${{ github.sha }}
          path: backend/public/build
          if-no-files-found: error
          retention-days: 14

      - name: Run Composer Audit
        run: cd backend && composer audit --locked

      - name: Run Laravel Pint
        run: cd backend && php vendor/bin/pint --test

      - name: Test Migrations on Fresh Database
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: anot_test
          DB_USERNAME: anot_user
          DB_PASSWORD: secret_test_password
        run: cd backend && php artisan migrate --force

      - name: Run PHPUnit Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: cd backend && php vendor/bin/phpunit

      - name: Validate cached routes
        env:
          APP_KEY: base64:ZYh7dbs969wT0qn7Ljglrebtzn6XXuB7G3L390AUdi0=
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: cd backend && php artisan route:cache

  docker-build:
    name: Backend production image build
    needs: [mobile-quality, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: backend
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_URL: https://api.anot.app
          APP_KEY: base64:ci-validation-key
          MOBILE_RESET_URL: anot://reset-password
          SUPPORT_EMAIL: ci@example.test
          DB_DATABASE: anot_ci
          DB_USERNAME: anot_ci
          DB_PASSWORD: ci-only-placeholder
          MAIL_MAILER: brevo
          BREVO_API_KEY: ci-only-placeholder
          MAIL_FROM_ADDRESS: ci@example.test
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag anot-backend:${{ github.sha }} backend
