name: ANOT CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  mobile-typecheck:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: cd mobile && npm ci

      - name: Run TypeScript Check
        run: cd mobile && npx tsc --noEmit

  backend-tests:
    name: Backend PHPUnit & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anot_test
          POSTGRES_USER: anot_user
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: cd backend && composer install --prefer-dist --no-interaction --no-progress

      - name: Run Composer Audit
        run: cd backend && composer audit --locked

      - name: Test Migrations on Fresh Database
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: anot_test
          DB_USERNAME: anot_user
          DB_PASSWORD: secret_test_password
        run: cd backend && php artisan migrate --force

      - name: Run PHPUnit Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: cd backend && php vendor/bin/phpunit
